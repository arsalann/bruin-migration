    connection_preflight_completed: true
    schema_contract: freeze
    schema_policy_acknowledged: true
    schedule_approved: false
    schedule: ""
    validation_boundary:
      strategy: consistent_snapshot
      approved: true
    tables:
      public.orders:
        approved: true
        target_write_approved: true
