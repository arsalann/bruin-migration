services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - ../fixtures/postgres/init.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
      - ../.artifacts/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 2s
      timeout: 3s
      retries: 30

  metabase:
    image: metabase/metabase:v0.53.8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_HOST: 0.0.0.0
    volumes:
      - ../.artifacts/metabase:/metabase-data
    ports:
      - "127.0.0.1::3000"
