services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: fixture-postgres-secret
    volumes:
      - ../fixtures/postgres/init.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration"]
      interval: 2s
      timeout: 3s
      retries: 45

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: migration
      CLICKHOUSE_USER: migration
      CLICKHOUSE_PASSWORD: fixture-clickhouse-secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1::8123"
      - "127.0.0.1::9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - "CMD-SHELL"
        - "clickhouse-client --user migration --password fixture-clickhouse-secret --query 'SELECT 1'"
      interval: 2s
      timeout: 5s
      retries: 45

volumes:
  postgres-data:
  clickhouse-data:
